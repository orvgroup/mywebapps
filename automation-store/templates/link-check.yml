name: Check Website Links

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.html"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown and HTML
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress "**/*.md" "**/*.html"
          fail: true
