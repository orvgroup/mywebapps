name: Prettier Format Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check formatting
        run: |
          npx --yes prettier@3 --check "**/*.{js,jsx,ts,tsx,json,css,html,md,yml,yaml}"
