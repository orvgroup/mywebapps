<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ஸ்ரீ மகா விஷ்ணு</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="temple">
        <div class="heading">
            <h1>ॐ நமோ நாராயணாய</h1>
            <p>ஸ்ரீ மகா விஷ்ணு பகவான்</p>
        </div>
        <div class="art-container">
            <div class="halo"></div>
            <div class="mandala"></div>
            <svg id="vishnu" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="நான்கு திருக்கரங்களுடன் மகா விஷ்ணு">
                <defs>
                    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#a5e7ff"/><stop offset=".4" stop-color="#2586d8"/><stop offset="1" stop-color="#073c9b"/>
                    </linearGradient>
                    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#fff4a6"/><stop offset=".3" stop-color="#e9b52e"/><stop offset=".65" stop-color="#a96308"/><stop offset="1" stop-color="#ffdf68"/>
                    </linearGradient>
                    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#fff4a0"/><stop offset=".5" stop-color="#e9a900"/><stop offset="1" stop-color="#b76b00"/>
                    </linearGradient>
                    <radialGradient id="face"><stop offset="0" stop-color="#8bd9ff"/><stop offset="1" stop-color="#1763bb"/></radialGradient>
                    <radialGradient id="light"><stop offset="0" stop-color="#fff9c8" stop-opacity=".7"/><stop offset="1" stop-color="#ffcc33" stop-opacity="0"/></radialGradient>
                </defs>
                <circle cx="300" cy="350" r="250" fill="url(#light)"/>
                <!-- Four arms -->
                <g stroke="#073d91" stroke-width="2">
                    <path d="M250 310 C205 260 160 215 105 190 Q80 175 75 200 Q90 235 145 270 L235 370Z" fill="url(#skin)"/>
                    <path d="M350 310 C395 260 440 215 495 190 Q520 175 525 200 Q510 235 455 270 L365 370Z" fill="url(#skin)"/>
                    <path d="M250 400 C190 410 145 465 115 510 Q100 535 125 545 Q155 545 180 510 L280 455Z" fill="url(#skin)"/>
                    <path d="M350 400 C410 410 455 465 485 510 Q500 535 475 545 Q445 545 420 510 L320 455Z" fill="url(#skin)"/>
                </g>
                <!-- Shankha -->
                <g transform="translate(65 120) rotate(-25)">
                    <path d="M20 55 C-5 40 5 0 40 0 C80 0 100 40 80 75 C65 100 30 95 20 55Z" fill="#fff2d2" stroke="#bd8b30" stroke-width="5"/>
                    <path d="M40 12 Q60 35 35 55 Q65 45 72 72" fill="none" stroke="#c18c35" stroke-width="4"/>
                    <path d="M15 75 Q45 95 80 75" fill="none" stroke="#d8aa54" stroke-width="4"/>
                    <circle cx="45" cy="45" r="7" fill="#d9a744"/>
                </g>
                <!-- Sudarshana chakra -->
                <g transform="translate(520 120)">
                    <circle r="49" fill="none" stroke="url(#gold)" stroke-width="9"/>
                    <circle r="37" fill="none" stroke="#ffdf67" stroke-width="3"/>
                    <circle r="15" fill="url(#gold)"/><circle r="6" fill="#fff4b0"/>
                    <g stroke="#ffda52" stroke-width="6">
                        <path d="M0 -15 V-39"/><path d="M0 15 V39"/><path d="M-15 0 H-39"/><path d="M15 0 H39"/>
                        <path d="M-11 -11 L-29 -29"/><path d="M11 11 L29 29"/><path d="M11 -11 L29 -29"/><path d="M-11 11 L-29 29"/>
                    </g>
                </g>
                <!-- Lotus -->
                <g transform="translate(105 500)">
                    <path d="M0 0 Q-48 -65 -55 -5 Q-30 28 0 0Z" fill="#f7a2cf" stroke="#a64b82" stroke-width="3"/>
                    <path d="M0 0 Q-20 -85 0 -90 Q22 -65 0 0Z" fill="#ffe1ef" stroke="#b75a91" stroke-width="3"/>
                    <path d="M0 0 Q48 -65 55 -5 Q30 28 0 0Z" fill="#f7a2cf" stroke="#a64b82" stroke-width="3"/>
                    <path d="M-25 5 Q0 25 25 5" fill="none" stroke="#c18c35" stroke-width="5"/>
                </g>
                <!-- Gada -->
                <g transform="translate(480 460)">
                    <path d="M0 0 L0 105" stroke="url(#gold)" stroke-width="15" stroke-linecap="round"/>
                    <path d="M-25 -15 Q-45 -45 -20 -70 Q0 -100 25 -70 Q45 -45 25 -15 Q0 10 -25 -15Z" fill="url(#gold)" stroke="#9c650e" stroke-width="4"/>
                    <path d="M-20 -55 Q0 -75 20 -55" fill="none" stroke="#fff0a0" stroke-width="5"/>
                    <path d="M-15 -5 H15" stroke="#fff0a0" stroke-width="4"/>
                </g>
                <!-- Body and neck -->
                <path d="M245 300 Q300 270 355 300 L385 455 Q380 535 345 600 L255 600 Q220 535 215 455Z" fill="url(#skin)" stroke="#073d91" stroke-width="3"/>
                <path d="M270 250 L270 325 Q300 350 330 325 L330 250Z" fill="url(#skin)"/>
                <!-- Head and ears -->
                <ellipse cx="300" cy="205" rx="83" ry="102" fill="url(#face)" stroke="#073d91" stroke-width="3"/>
                <ellipse cx="218" cy="210" rx="15" ry="27" fill="url(#skin)" stroke="#073d91" stroke-width="3"/>
                <ellipse cx="382" cy="210" rx="15" ry="27" fill="url(#skin)" stroke="#073d91" stroke-width="3"/>
                <!-- Crown -->
                <path d="M220 140 L230 65 Q250 35 300 15 Q350 35 370 65 L380 140 Q300 165 220 140Z" fill="url(#gold)" stroke="#925b0c" stroke-width="5"/>
                <path d="M240 85 Q300 45 360 85" fill="none" stroke="#fff1a0" stroke-width="7"/>
                <path d="M230 115 Q300 140 370 115" fill="none" stroke="#9e650e" stroke-width="5"/>
                <path d="M270 60 Q300 30 330 60 Q300 95 270 60Z" fill="#db294e" stroke="#ffe68a" stroke-width="4"/>
                <circle cx="300" cy="48" r="10" fill="#26bde8"/>
                <g fill="#f5d15b" stroke="#a36a0c" stroke-width="2">
                    <circle cx="250" cy="95" r="8"/><circle cx="350" cy="95" r="8"/><circle cx="300" cy="110" r="9"/><circle cx="280" cy="135" r="5"/><circle cx="320" cy="135" r="5"/>
                </g>
                <!-- Vaishnava tilak -->
                <path d="M285 145 Q300 165 315 145" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>
                <path d="M297 145 L297 170 L303 170 L303 145" fill="#e82d3c"/>
                <circle cx="300" cy="180" r="4" fill="#ffdf65"/>
                <!-- Face -->
                <path d="M250 195 Q270 180 287 195 M313 195 Q330 180 350 195" stroke="#102d59" stroke-width="5" fill="none"/>
                <ellipse cx="270" cy="195" rx="6" ry="4" fill="#111"/><ellipse cx="330" cy="195" rx="6" ry="4" fill="#111"/>
                <path d="M300 190 Q287 220 300 225" stroke="#1558a3" stroke-width="3" fill="none"/>
                <path d="M280 239 Q300 253 320 239" stroke="#742d44" stroke-width="3" fill="none" stroke-linecap="round"/>
                <!-- Earrings -->
                <g fill="url(#gold)" stroke="#925b0c" stroke-width="3">
                    <circle cx="218" cy="238" r="13"/><circle cx="382" cy="238" r="13"/>
                    <path d="M210 250 Q218 275 226 250Z"/><path d="M374 250 Q382 275 390 250Z"/>
                </g>
                <!-- Necklaces and Kaustubha -->
                <path d="M260 290 Q300 345 340 290" stroke="url(#gold)" stroke-width="13" fill="none"/>
                <path d="M250 315 Q300 370 350 315" stroke="#ffdb57" stroke-width="7" fill="none"/>
                <path d="M245 330 Q300 440 355 330" fill="none" stroke="url(#gold)" stroke-width="8"/>
                <path d="M260 350 Q300 420 340 350" fill="none" stroke="#fff0a0" stroke-width="4"/>
                <path d="M300 375 L320 400 L300 430 L280 400Z" fill="#16d6ed" stroke="#f7d66b" stroke-width="5"/>
                <circle cx="300" cy="400" r="6" fill="#fff"/>
                <!-- Waist belt and Pitambaram -->
                <path d="M230 480 Q300 510 370 480" stroke="url(#gold)" stroke-width="17" fill="none"/>
                <circle cx="300" cy="490" r="17" fill="#f6d56a" stroke="#9b640b" stroke-width="4"/>
                <path d="M235 500 Q300 530 365 500 L395 690 Q300 745 205 690Z" fill="url(#cloth)" stroke="#9b5d0b" stroke-width="4"/>
                <path d="M300 520 Q260 610 245 700 M300 520 Q340 610 355 700" stroke="#fff1a0" stroke-width="7" fill="none"/>
                <path d="M270 530 Q285 620 280 710 M330 530 Q315 620 320 710" stroke="#b9750b" stroke-width="5" fill="none"/>
                <path d="M215 690 Q300 735 385 690" stroke="#fff0a0" stroke-width="10" fill="none"/>
                <path d="M215 700 Q300 745 385 700" stroke="#a65c0b" stroke-width="4" fill="none"/>
                <!-- Armlets and bangles -->
                <g fill="url(#gold)" stroke="#98600d" stroke-width="3">
                    <ellipse cx="165" cy="280" rx="20" ry="9"/><ellipse cx="435" cy="280" rx="20" ry="9"/>
                    <ellipse cx="160" cy="475" rx="19" ry="9"/><ellipse cx="440" cy="475" rx="19" ry="9"/>
                </g>
                <g fill="none" stroke="#f4d05d" stroke-width="6">
                    <path d="M190 300 Q205 310 215 320"/><path d="M410 300 Q395 310 385 320"/>
                </g>
                <ellipse cx="300" cy="745" rx="105" ry="17" fill="#f4c66b" opacity=".5"/>
            </svg>
            <div class="divine-light"></div>
        </div>
        <div class="footer">
            <h2>ஸ்ரீமன் நாராயணன் திருவடிகளே சரணம்</h2>
            <p>ॐ நமோ நாராயணாய 🙏</p>
        </div>
    </main>
    <script src="assets/js/script.js"></script>
</body>
</html>
